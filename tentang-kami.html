<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Admin Gazebo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

  <header class="bg-amber-900 text-white p-4 shadow">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="font-bold text-lg">Dashboard Admin</h1>
      <a href="index.html" class="text-xs bg-amber-800 hover:bg-amber-700 px-3 py-1.5 rounded text-amber-100">Lihat Web</a>
    </div>
  </header>

  <main class="p-4 sm:p-8 max-w-4xl mx-auto">
    <div class="bg-white p-5 sm:p-8 rounded-xl shadow border border-gray-200">
      <h2 class="text-xl font-bold mb-4 text-amber-950">Tambah Produk Baru</h2>
      <form class="space-y-4">
        <div>
          <label class="block text-xs sm:text-sm font-medium text-gray-700">Nama Produk Gazebo</label>
          <input type="text" class="w-full border rounded-lg p-2.5 mt-1 text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-medium text-gray-700">Harga (Rp)</label>
          <input type="number" class="w-full border rounded-lg p-2.5 mt-1 text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
        </div>
        <button type="submit" class="w-full sm:w-auto bg-amber-800 hover:bg-amber-900 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition">Simpan Produk</button>
      </form>
    </div>
  </main>

</body>
</html>
