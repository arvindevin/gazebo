<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Admin Gazebo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-8">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow">
    <h1 class="text-2xl font-bold mb-4">Dashboard Admin - Tambah Produk</h1>
    <form class="space-y-4">
      <div>
        <label class="block text-sm font-medium">Nama Produk Gazebo</label>
        <input type="text" class="w-full border p-2 rounded mt-1">
      </div>
      <div>
        <label class="block text-sm font-medium">Harga (Rp)</label>
        <input type="number" class="w-full border p-2 rounded mt-1">
      </div>
      <button class="bg-amber-800 text-white px-4 py-2 rounded">Simpan Produk Baru</button>
    </form>
  </div>
</body>
</html>
