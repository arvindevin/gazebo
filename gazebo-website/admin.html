<div class="flex min-h-screen">
    <!-- Sidebar Admin -->
    <aside class="w-64 bg-amber-950 text-white p-6 hidden md:block">
        <h1 class="text-xl font-bold mb-8 text-amber-400">Admin GazeboJati</h1>
        <nav class="space-y-4">
            <a href="#" class="block py-2 px-4 bg-amber-900 rounded font-semibold">Manajemen Produk</a>
            <a href="index.html" class="block py-2 px-4 hover:bg-amber-900 rounded text-amber-200">Lihat Website</a>
        </nav>
    </aside>

    <!-- Main Admin Content -->
    <main class="flex-1 p-8">
        <h2 class="text-2xl font-bold mb-6">Tambah Produk Gazebo Baru</h2>
        
        <div class="bg-white p-6 rounded-xl shadow border max-w-xl mb-8">
            <form id="adminAddProductForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Nama Produk Gazebo</label>
                    <input type="text" id="prodNama" required class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Kategori Material</label>
                    <select id="prodKategori" class="w-full border p-2 rounded">
                        <option value="jati">Kayu Jati</option>
                        <option value="kelapa">Kayu Kelapa</option>
                        <option value="bambu">Bambu</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Harga (Rp)</label>
                    <input type="number" id="prodHarga" required class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">URL Gambar Produk</label>
                    <input type="url" id="prodGambar" placeholder="https://..." required class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Deskripsi Singkat</label>
                    <textarea id="prodDeskripsi" rows="3" class="w-full border p-2 rounded"></textarea>
                </div>
                <button type="submit" class="bg-amber-900 text-white font-bold py-2.5 px-6 rounded hover:bg-amber-800 transition">
                    Simpan Ke Database
                </button>
            </form>
        </div>
    </main>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
